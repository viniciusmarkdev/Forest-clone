<div class="container-fluid">
    <div class="row">
        <!-- Coluna da imagem (esquerda) -->
        <div class="col-md-6" id="img-bg"></div>
        
        <!-- Coluna do formulário (direita) -->
        <div class="col-md-6 d-flex align-items-center justify-content-center">
            <div class="p-5" style="width: 100%; max-width: 500px;">
                <h1 class="text-center mb-3">Entrar no Forest</h1>
                
                <div class="form-group">
                    <label for="usuario">Email</label>
                    <input [(ngModel)]='userLogin.usuario' class="form-control" type="text" name="usuario" id="usuario" placeholder="Seu usuário">
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>
                    <input [(ngModel)]='userLogin.senha' class="form-control" type="password" name="senha" id="senha" placeholder="Sua senha">
                </div>

                <div class="d-flex justify-content-center">
                    <button class="btn btn-success" (click)='entrar()'>Entrar</button>
                </div>

                <hr class="mt-5 mb-5">

                <p class="text-center">
                    Não tem uma conta? <a routerLink='/cadastrar'>Cadastre-se</a>
                </p>
            </div>
        </div>
    </div>
</div>
