<div class="container-fluid">
    <div class="row">
        <div class="col-md-5" id="img-bg"></div>
        <div class="col-md-6 mt-5 mb-5">
            <div class="row d-flex justify-content-center">
                <div class="col-md-10">
                    <h1 class="text-center">Cadastro</h1>
                    <div class="form-group">
                        <label for="nome">Nome</label>
                        <input [(ngModel)]='user.nome' class="form-control" type="text" name="nome" 
                        id="nome" placeholder="Seu nome">
                    </div>
                    <div class="form-group">
                        <label for="usuario">Email</label>
                        <input [(ngModel)]='user.usuario' class="form-control" type="text" name="usuario" id="usuario" placeholder="Seu email">
                    </div>
                    <div class="form-group">
                        <label for="foto">Link da Foto</label>
                        <input  [(ngModel)]='user.foto' class="form-control" type="text" name="foto" id="foto" placeholder="Sua foto">
                    </div>
                    <div class="form-group">
                        <label for="senha">Senha</label>
                        <input (input)='confirmSenha($event)'class="form-control" type="password" name="senha" id="senha" placeholder="Sua senha">
                    </div>

                    <div class="form-group">
                        <label for="confirmarsenha">Senha</label>
                        <input [(ngModel)]='user.senha'     class="form-control" type="password" name="confirmarsenha" id="confirmarsenha"
                            placeholder="Confirme sua senha">
                    </div>

                    
                    <div class="d-flex justify-content-center mt-3 ">
                        <button type="submit" class="btn btn-danger mr-4" routerLink='/entrar'>Cancelar</button>
                        <button type="submit" class="btn btn-success mr-4" (click)='cadastrar()'>Cadastrar</button>
                    </div>
                </div>

            </div>
        </div>
    </div>


</div>
