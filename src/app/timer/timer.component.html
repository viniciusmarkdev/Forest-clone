    <div class="content" [class.move]="animate" [ngClass]="{'back-opacity': isTimerRunning}">
        
        <div id="root">

            
            <div class="home__wrap">

                <div class="coin">{{user.allCoins}}</div>
                <img src="data:image/svg+xml,%3csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2022%2022'%3e%3cdefs%3e%3cstyle%3e.cls-1{fill:%23fff;}.cls-2{fill:%23bd9d00;}.cls-3{fill:%23ffda00;}.cls-4{fill:%23dbb700;}%3c/style%3e%3c/defs%3e%3cg%20id='profile'%3e%3cpath%20class='cls-1'%20d='M7.76,15.38a2,2,0,0,1-.2-.55,4,4,0,0,1-.1-1.42,3.12,3.12,0,0,1,.69-1.71,2.91,2.91,0,0,1,1.25-.84,4.33,4.33,0,0,1,1.24-.22,4.2,4.2,0,0,0-.59,1,1.45,1.45,0,0,0-.07.88.79.79,0,0,0,.44.44l.29.1.15,0s.12,0,.08-.09Z'/%3e%3cellipse%20class='cls-2'%20cx='11'%20cy='11.52'%20rx='8'%20ry='7.48'/%3e%3cellipse%20class='cls-3'%20cx='11'%20cy='10.48'%20rx='8'%20ry='7.48'/%3e%3cpath%20class='cls-4'%20d='M14.24,11.91A3.92,3.92,0,0,1,10.6,14.2,3.22,3.22,0,0,1,7.39,11c0-2.66,2.38-3.33,3.64-3.46S13,6.81,13,5.8A5.93,5.93,0,0,1,14.24,11.91Z'/%3e%3cpath%20class='cls-2'%20d='M8,11.5C8,8.84,10.43,8.17,11.68,8a2,2,0,0,0,2-1.43A7.41,7.41,0,0,0,13,5.8c0,1-.85,1.6-2,1.72S7.39,8.32,7.39,11A3.23,3.23,0,0,0,9,13.75,3.19,3.19,0,0,1,8,11.5Z'/%3e%3c/g%3e%3c/svg%3e" class="sc-jIyAiq MtDfz">
            
            
                <div class="home__content">
                    <!-- Texto -->
                    <i>{{texto}}</i>

                    
                    
                    <!-- Imagem da planta -->
                    <div class="timer__wrap" (click)="minutos > 0 ? start() : null" [ngClass]="{'disabled': minutos === 0}">
                        <div class="timer__visual">
                           
                            <div class="pinheiro">

                                <img [src]="arvore1" >
                            </div>
                      

                            <img [src]="imagemSrc" alt="tree">


                        </div>

                        
                    </div>

                    <!-- Tempo -->
                    <div class="content-timer">
                        <div class="content-s">
                            <div class="time">{{minutos | number:'2.0'}}:{{segundos | number:'2.0'}}<span></span></div>
                            <!-- Setas -->
                            <img class="seta-direita" [src]="seta" alt="seta" (click)="increment()" *ngIf="!isTimerRunning">
                            <img class="seta-esquerda" [src]="seta1" alt="seta1" (click)="decrement()" *ngIf="!isTimerRunning">
                        </div>
                    </div>

                    <!-- Botão "Give Up" visível apenas quando o timer estiver rodando -->
                    <div class="fEMoAT" *ngIf="isTimerRunning" (click)="reset()">
                        Give Up
                    </div>
                </div>
            </div>
        </div>

        <!-- Camada de sobreposição -->
        <div *ngIf="isTimerRunning" class="black-overlay"></div>
    </div>
